plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'com.tabibma'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

ext {
    jjwtVersion = '0.12.6'
}

// Pinned above Spring Boot 3.5.16's own BOM version (Trivy scan, 2026-08-07): plain Gradle
// constraints (even `strictly`) lose to io.spring.dependency-management's own resolution rules —
// this DSL is that plugin's own override mechanism, the only thing that actually wins.
// netty-codec/netty-handler: pulled in via Lettuce (spring-boot-starter-data-redis) and
// Testcontainers; BOM manages 4.1.135.Final, which doesn't cover
// CVE-2026-59901/CVE-2026-44891/55831/55833 (fixed in 4.1.136.Final+).
dependencyManagement {
    dependencies {
        dependency 'io.netty:netty-codec:4.1.136.Final'
        dependency 'io.netty:netty-handler:4.1.136.Final'
    }
}

// Trivy's fs scanner (CI's security job) can't resolve Gradle dependencies without a lockfile —
// this generates gradle.lockfile, checked in, so Trivy actually covers backend dependency CVEs
// instead of silently finding 0 manifests. Regenerate with `./gradlew dependencies --write-locks`
// whenever a dependency changes.
dependencyLocking {
    lockAllConfigurations()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // Pinned explicitly (Trivy scan, 2026-08-07): Spring Boot 3.5.16's BOM still manages 42.7.11,
    // which doesn't cover CVE-2026-54291 (channel-binding downgrade, fixed in 42.7.12+).
    runtimeOnly 'org.postgresql:postgresql:42.7.13'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'

    // Prescription PDF generation (Story 7.1) — Apache 2.0 licensed, avoids the AGPL terms of
    // iText's current major versions for a document type (medical prescriptions) we generate,
    // not just render.
    implementation 'org.apache.pdfbox:pdfbox:3.0.3'

    // Required by Spring Security's Argon2PasswordEncoder (docs/security-tabib-ma.md Section 3).
    runtimeOnly 'org.bouncycastle:bcprov-jdk18on:1.85'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.1'
    testImplementation 'org.testcontainers:postgresql:1.20.1'
    testImplementation 'org.testcontainers:testcontainers:1.20.1'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.jacocoTestReport
}

jacocoTestReport {
    dependsOn tasks.test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn tasks.jacocoTestReport
    violationRules {
        rule {
            limit {
                minimum = 0.80
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.jacocoTestCoverageVerification
}
